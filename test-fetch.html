<!DOCTYPE html>
<html>
<body>
<script type="module">
import { api } from "./src/api/firebaseApp.js";

async function test() {
  try {
    const data = await api.fetchHistoryPage(10);
    const keys = Object.keys(data);
    document.body.innerHTML = "SUCCESS: " + keys.length;
  } catch (e) {
    document.body.innerHTML = "ERROR: " + e.message;
  }
}
test();
</script>
</body>
</html>
